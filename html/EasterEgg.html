<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030711">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>也请你看场“赛博”烟花</title>
  <link rel="stylesheet" href="../css/birthday.css">
  <link rel="stylesheet" href="../css/easter.css">
</head>
<body class="egg-page">
  <canvas></canvas>
  <canvas></canvas>
  <canvas></canvas>

  <header class="egg-copy">
    <p class="eyebrow">FOR 思萍</p>
    <h1>烟花是代码做的，<br>放完就散了</h1>
    <p>生日快乐是真的。</p>
  </header>

  <footer class="egg-footer">
    <a href="Memories.html?music=1">再看一遍</a>
    <a href="../index.html" target="_top">从头打开</a>
  </footer>

  <audio id="birthdayAudio" src="../music/1.mp3?v=3" preload="none" loop playsinline></audio>
  <script>
    class Shard {
      constructor(x, y, hue) {
        this.x = x;
        this.y = y;
        this.hue = hue;
        this.lightness = 50;
        this.size = 12 + Math.random() * 10;
        const angle = Math.random() * 2 * Math.PI;
        const blastSpeed = 1 + Math.random() * 6;
        this.xSpeed = Math.cos(angle) * blastSpeed;
        this.ySpeed = Math.sin(angle) * blastSpeed;
        this.target = getTarget();
        this.ttl = 110;
        this.timer = 0;
      }

      draw() {
        ctx2.fillStyle = `hsl(${this.hue}, 100%, ${this.lightness}%)`;
        ctx2.beginPath();
        ctx2.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
        ctx2.closePath();
        ctx2.fill();
      }

      update() {
        if (this.target) {
          const dx = this.target.x - this.x;
          const dy = this.target.y - this.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          const angle = Math.atan2(dy, dx);
          const tx = Math.cos(angle) * 5;
          const ty = Math.sin(angle) * 5;

          this.size = lerp(this.size, 1.4, 0.05);

          if (distance < 5) {
            this.lightness = lerp(this.lightness, 100, 0.012);
            this.xSpeed = 0;
            this.ySpeed = 0;
            this.x = lerp(this.x, this.target.x + fidelity / 2, 0.06);
            this.y = lerp(this.y, this.target.y + fidelity / 2, 0.06);
            this.timer += 1;
          } else if (distance < 12) {
            this.lightness = lerp(this.lightness, 100, 0.01);
            this.xSpeed = lerp(this.xSpeed, tx, 0.1);
            this.ySpeed = lerp(this.ySpeed, ty, 0.1);
            this.timer += 1;
          } else {
            this.xSpeed = lerp(this.xSpeed, tx, 0.025);
            this.ySpeed = lerp(this.ySpeed, ty, 0.025);
          }
        } else {
          this.ySpeed += 0.045;
          this.size = lerp(this.size, 1, 0.05);
          if (this.y > c2.height) {
            const index = shards.indexOf(this);
            if (index >= 0) {
              shards.splice(index, 1);
            }
          }
        }

        this.x += this.xSpeed;
        this.y += this.ySpeed;
      }
    }

    class Rocket {
      constructor() {
        const quarterWidth = c2.width / 4;
        this.x = quarterWidth + Math.random() * (c2.width - quarterWidth);
        this.y = c2.height - 15;
        this.angle = Math.random() * Math.PI / 4 - Math.PI / 6;
        this.blastSpeed = 6 + Math.random() * 7;
        this.xSpeed = Math.sin(this.angle) * this.blastSpeed;
        this.ySpeed = -Math.cos(this.angle) * this.blastSpeed;
        this.hue = Math.floor(Math.random() * 360);
      }

      draw() {
        ctx2.save();
        ctx2.translate(this.x, this.y);
        ctx2.rotate(Math.atan2(this.ySpeed, this.xSpeed) + Math.PI / 2);
        ctx2.fillStyle = `hsl(${this.hue}, 100%, 64%)`;
        ctx2.fillRect(0, 0, 4, 13);
        ctx2.restore();
      }

      update() {
        this.x += this.xSpeed;
        this.y += this.ySpeed;
        this.ySpeed += 0.1;
      }

      explode() {
        for (let i = 0; i < 70; i += 1) {
          shards.push(new Shard(this.x, this.y, this.hue));
        }
      }
    }

    const [c1, c2, c3] = document.querySelectorAll('canvas');
    const [ctx1, ctx2, ctx3] = [c1, c2, c3].map((canvas) => canvas.getContext('2d'));
    const rockets = [];
    const shards = [];
    const targets = [];
    const fidelity = 3;
    const text = '思萍，生日快乐';
    let fontSize = 200;
    let textWidth = 99999999;
    let counter = 0;
    let lastTime = performance.now();

    function sizeCanvases() {
      c1.style.opacity = '0';
      c2.width = c3.width = window.innerWidth;
      c2.height = c3.height = window.innerHeight;

      ctx1.font = '900 200px Microsoft YaHei, sans-serif';
      textWidth = ctx1.measureText(text).width;
      fontSize = 200;

      while (textWidth > window.innerWidth * 0.9) {
        fontSize -= 2;
        ctx1.font = `900 ${fontSize}px Microsoft YaHei, sans-serif`;
        textWidth = ctx1.measureText(text).width;
      }

      c1.width = Math.ceil(textWidth);
      c1.height = Math.ceil(fontSize * 1.5);
      ctx1.font = `900 ${fontSize}px Microsoft YaHei, sans-serif`;
      ctx1.textBaseline = 'top';
      ctx1.fillStyle = '#000';
      ctx1.fillText(text, 0, fontSize * 0.16);

      targets.length = 0;
      const imageData = ctx1.getImageData(0, 0, c1.width, c1.height);
      for (let i = 0; i < imageData.data.length; i += 4) {
        const alpha = imageData.data[i + 3];
        const x = Math.floor(i / 4) % imageData.width;
        const y = Math.floor(i / 4 / imageData.width);
        if (alpha && x % fidelity === 0 && y % fidelity === 0) {
          targets.push({ x, y });
        }
      }

      ctx3.fillStyle = '#fff';
      ctx3.shadowColor = '#fff';
      ctx3.shadowBlur = 18;
    }

    function getTarget() {
      if (targets.length === 0) {
        return null;
      }
      const index = Math.floor(Math.random() * targets.length);
      let target = targets[index];
      targets.splice(index, 1);
      return {
        x: target.x + c2.width / 2 - textWidth / 2,
        y: target.y + c2.height / 2 - fontSize / 2
      };
    }

    function lerp(a, b, amount) {
      return Math.abs(b - a) > 0.1 ? a + amount * (b - a) : b;
    }

    sizeCanvases();
    document.body.dataset.eggReady = 'true';
    document.body.dataset.fireworks = 'running';

    (function loop(now) {
      const delta = Math.min((now - lastTime) / 16.67, 2.4);
      lastTime = now;

      ctx2.fillStyle = 'rgba(3, 7, 17, 0.105)';
      ctx2.fillRect(0, 0, c2.width, c2.height);
      counter += delta;

      if (counter % 17 < 1) {
        rockets.push(new Rocket());
      }

      rockets.forEach((rocket, index) => {
        rocket.update();
        rocket.draw();
        if (rocket.ySpeed > 0) {
          rocket.explode();
          rockets.splice(index, 1);
        }
      });

      shards.forEach((shard, index) => {
        shard.draw();
        shard.update();
        if (shard.timer >= shard.ttl || shard.lightness >= 99) {
          ctx3.fillRect(shard.target.x, shard.target.y, fidelity + 1, fidelity + 1);
          shards.splice(index, 1);
        }
      });

      requestAnimationFrame(loop);
    }(performance.now()));

    window.addEventListener('resize', function () {
      window.location.reload();
    });
  </script>
  <script src="../js/birthday-audio.js"></script>
</body>
</html>
