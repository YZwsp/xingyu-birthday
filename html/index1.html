<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090f1f">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>生日快乐，思萍</title>
  <link rel="stylesheet" href="../css/normalize.css">
  <link rel="stylesheet" href="../css/stylel.css">
  <link rel="stylesheet" href="../css/birthday.css">
  <link rel="stylesheet" href="../css/cake-intro.css">
  <style>
    html,
    body,
    .canvas {
      background:
        radial-gradient(circle at 50% 55%, rgba(68, 99, 148, 0.16), transparent 44%),
        #090f1f !important;
    }

    .ui,
    .help,
    .overlay {
      display: none !important;
    }

    .canvas {
      width: calc(100vw - 20px);
      height: calc(100vh - 20px);
    }
  </style>
</head>
<body class="particle-page">
  <canvas class="canvas" aria-hidden="true"></canvas>
  <div class="help" aria-hidden="true">?</div>
  <div class="ui" aria-hidden="true">
    <input class="ui-input" type="text" tabindex="-1">
    <span class="ui-return">↵</span>
  </div>
  <div class="cake-arrival" id="cakeArrival" aria-hidden="true">
    <div class="cake-arrival__scene" id="cakeArrivalScene"></div>
    <div class="cake-arrival__copy">
      <span>下一幕 · 点亮蜡烛</span>
      <p>许个愿吧，愿望不用告诉任何人。</p>
    </div>
    <div class="cake-arrival__actions">
      <button class="blow-button" id="blowCandleButton" type="button">吹蜡烛</button>
    </div>
  </div>

  <template id="cakeAnimationTemplate">
  <div class="cake-arrival__piece">
<svg class="cake-intro-art" viewBox="0 0 420 360" role="img" aria-label="插着蜡烛的生日蛋糕">
        <defs>
          <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f8f1e8" stop-opacity="0.96"/>
            <stop offset="100%" stop-color="#9faec2" stop-opacity="0.78"/>
          </linearGradient>
          <linearGradient id="cakeTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff4df"/>
            <stop offset="100%" stop-color="#e8c69f"/>
          </linearGradient>
          <linearGradient id="cakeBottom" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#df9fa4"/>
            <stop offset="100%" stop-color="#bd7181"/>
          </linearGradient>
          <linearGradient id="icing" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fffaf1"/>
            <stop offset="100%" stop-color="#f2dfc7"/>
          </linearGradient>
          <filter id="flameGlow" x="-200%" y="-200%" width="400%" height="400%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <ellipse cx="210" cy="319" rx="148" ry="18" fill="url(#plate)"/>
        <ellipse cx="210" cy="313" rx="118" ry="13" fill="#d7dce2" opacity="0.52"/>
        <rect x="84" y="229" width="252" height="71" rx="13" fill="url(#cakeBottom)"/>
        <path d="M82 232c18 22 40 25 61 7 18 19 39 19 59 0 19 19 41 18 58 0 19 20 42 18 60-7l12 10v24H82v-24Z" fill="url(#icing)"/>
        <rect x="105" y="165" width="210" height="72" rx="11" fill="url(#cakeTop)"/>
        <path d="M103 169c16 18 35 19 52 5 18 17 36 18 54 2 18 16 37 17 55-1 15 14 34 14 50-5l10 9v22H105v-22Z" fill="url(#icing)"/>
        <path d="M122 203c8 6 16 6 24 0M172 201c8 6 16 6 24 0M222 201c8 6 16 6 24 0M272 203c8 6 16 6 24 0" fill="none" stroke="#e7c9a5" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

        <g>
          <rect x="158" y="92" width="11" height="79" rx="5" fill="#f5d38c"/>
          <path d="M158 112h11M158 139h11" stroke="#cc8f57" stroke-width="3"/>
          <path class="cake-svg-flame" d="M163.5 57c18 16 13 31 0 39-13-8-18-23 0-39Z" fill="#ffe29b" filter="url(#flameGlow)"/>
          <circle cx="163.5" cy="76" r="5" fill="#fff8cf"/>
        </g>
        <g>
          <rect x="205" y="87" width="11" height="84" rx="5" fill="#a9c7dd"/>
          <path d="M205 108h11M205 136h11" stroke="#668ba9" stroke-width="3"/>
          <path class="cake-svg-flame" d="M210.5 49c20 17 14 34 0 43-14-9-20-26 0-43Z" fill="#ffe29b" filter="url(#flameGlow)"/>
          <circle cx="210.5" cy="70" r="5" fill="#fff8cf"/>
        </g>
        <g>
          <rect x="252" y="94" width="11" height="77" rx="5" fill="#e8abbb"/>
          <path d="M252 114h11M252 140h11" stroke="#af687f" stroke-width="3"/>
          <path class="cake-svg-flame" d="M257.5 59c18 16 13 31 0 39-13-8-18-23 0-39Z" fill="#ffe29b" filter="url(#flameGlow)"/>
          <circle cx="257.5" cy="78" r="5" fill="#fff8cf"/>
        </g>
      </svg>
  </div>
</template>
  <div class="commands" aria-hidden="true"></div>
  <div class="overlay" aria-hidden="true"></div>

  <div class="birthday-blackout" id="birthdayBlackout" aria-hidden="true"></div>
  <audio id="birthdayAudio" src="../music/1.mp3" preload="auto" loop playsinline></audio>
  <script src="../js/indexl.js"></script>
  <script src="../js/particle-flow.js"></script>
  <script src="../js/birthday-audio.js"></script>
</body>
</html>
